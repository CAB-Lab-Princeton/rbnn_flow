[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "RBNN-FLow"
version = "0.0.1"
authors = [
  { name="Justice Mason", email="jjmason@alumni.princeton.edu" },
]
description = "Python package corresponding to project for the application of geometric NFs to leanring dynamics"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/pypa/sampleproject"
Issues = "https://github.com/pypa/sampleproject/issues"